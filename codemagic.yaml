workflows:
  ios-release:
    name: Black Eagle Staffing iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.blackeagle.staffing
      vars:
        XCODE_PROJECT: "ios/BlackEagleStaffing.xcodeproj"
        XCODE_SCHEME: "BlackEagleStaffing"
        APPLE_TEAM_ID: "42FRQR444G"
        PROFILE_NAME: "BlackEagleProfile"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build and export IPA
        script: |
          xcode-project use-profiles

          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --config Release \
            --archive-directory "$CM_BUILD_DIR/build" \
            --ipa-directory "$CM_BUILD_DIR/build/ios/ipa"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - build/*.xcarchive
