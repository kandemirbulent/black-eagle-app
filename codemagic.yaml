workflows:
  ios-simulator-debug:
    name: Black Eagle Staffing iOS Simulator Debug
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/BlackEagleStaffing.xcodeproj"
        XCODE_SCHEME: "BlackEagleStaffing"
    scripts:
      - name: Show Xcode version
        script: xcodebuild -version
      - name: Build for iOS Simulator (Debug)
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - /tmp/xcodebuild_logs/*.log