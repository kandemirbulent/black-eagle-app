<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Create Password</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }

    body {
      margin: 0;
      padding: 20px 14px;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: #eef0f3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 24px 18px;
      border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #333;
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: #666;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .form-label {
      display: flex;
      flex-direction: column;
      font-size: 0.9rem;
      font-weight: 600;
      color: #444;
      margin-bottom: 12px;
    }

    input {
      margin-top: 6px;
      padding: 13px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 1rem;
      background: #fafafa;
      width: 100%;
      max-width: 100%;
    }

    input:focus {
      border-color: #007bff;
      outline: none;
      box-shadow: 0 0 4px rgba(0,123,255,0.4);
      background: #fff;
    }

    .button {
      width: 100%;
      padding: 14px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1.05rem;
      cursor: pointer;
      margin-top: 15px;
      font-weight: 700;
    }

    .button:hover { background: #005fcc; }
    .button:disabled { opacity: 0.7; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      font-size: 14px;
      text-align: center;
      color: #666;
      line-height: 1.45;
    }

    .status.error { color: #b91c1c; }
    .status.ok { color: #166534; }

    @media (max-width: 480px) {
      body {
        padding: 14px 10px 20px;
        align-items: flex-start;
      }

      .container {
        padding: 20px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Create Password</h1>
    <div class="subtitle">
      Create your password first. Bank details will be collected in the next step.
    </div>

    <label class="form-label">Email:
      <input type="email" id="email" readonly>
    </label>

    <label class="form-label">Create Password:
      <input type="password" id="password" required>
    </label>

    <label class="form-label">Confirm Password:
      <input type="password" id="confirmPassword" required>
    </label>

    <button class="button" id="activateBtn">Create Password</button>
    <div id="status" class="status"></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const emailFromQuery = params.get("email");
    const tokenFromQuery = params.get("token");

    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const activateBtn = document.getElementById("activateBtn");
    const statusBox = document.getElementById("status");

    emailInput.value = emailFromQuery || "";

    function setStatus(message, type = "") {
      statusBox.textContent = message;
      statusBox.className = `status ${type}`.trim();
    }

    function setLoading(isLoading) {
      activateBtn.disabled = isLoading;
      activateBtn.textContent = isLoading ? "Saving..." : "Create Password";
    }

    function keepFieldVisible(field) {
      setTimeout(() => {
        field.scrollIntoView({ block: "center", inline: "nearest", behavior: "smooth" });
      }, 180);
    }

    [passwordInput, confirmPasswordInput].forEach((field) => {
      field.addEventListener("focus", () => keepFieldVisible(field));
      field.addEventListener("click", () => keepFieldVisible(field));
    });

    window.addEventListener("resize", () => {
      const active = document.activeElement;
      if (active && ["INPUT", "TEXTAREA", "SELECT"].includes(active.tagName)) {
        keepFieldVisible(active);
      }
    });

    activateBtn.addEventListener("click", async function () {
      const email = emailInput.value.trim().toLowerCase();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!email) {
        setStatus("Missing email. Please go back to the phone verification page.", "error");
        return;
      }

      if (!tokenFromQuery) {
        setStatus("Missing activation link. Please verify your phone number again.", "error");
        return;
      }

      if (!password || !confirmPassword) {
        setStatus("Please fill in both password fields.", "error");
        return;
      }

      if (password.length < 6) {
        setStatus("Password must be at least 6 characters.", "error");
        return;
      }

      if (password !== confirmPassword) {
        setStatus("Passwords do not match.", "error");
        return;
      }

      try {
        setLoading(true);
        setStatus("");

        const res = await fetch("/api/staff/set-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            email,
            password,
            token: tokenFromQuery
          })
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          setStatus(data.message || "Failed to create password.", "error");
          setLoading(false);
          return;
        }

        localStorage.setItem("staffPendingBankEmail", email);
        setStatus(data.message || "Password created successfully. Continue with bank details.", "ok");

        setTimeout(() => {
          window.location.href = `/staff-logins/staff-bank-setup.html?email=${encodeURIComponent(email)}`;
        }, 700);
      } catch (error) {
        console.error("Password setup error:", error);
        setStatus("Server connection failed.", "error");
        setLoading(false);
      }
    });
  </script>
  <script src="/js/support-widget.js" defer></script>
</body>
</html>
