<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Eagle Staffing Login</title>
  <meta name="theme-color" content="#0f172a" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(180deg, #0f172a 0%, #111827 52%, #1f2937 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #111827;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 25px 70px rgba(15, 23, 42, 0.35);
    }

    .logo-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .logo-wrap img {
      width: 92px;
      height: 92px;
      object-fit: contain;
      border-radius: 50%;
      background: #fff;
      border: 3px solid #111827;
    }

    h1 {
      text-align: center;
      font-size: 24px;
      margin-bottom: 20px;
      color: #0f172a;
    }

    .form-row {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border-radius: 12px;
      border: 1px solid #d1d5db;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #111827;
      box-shadow: 0 0 0 3px rgba(17, 24, 39, 0.08);
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 13px 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      margin-top: 10px;
    }

    .btn-primary {
      background: #111827;
      color: #fff;
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #111827;
      border: 1px solid #e5e7eb;
    }

    .link-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    .footer-links a {
      color: #4b5563;
      text-decoration: none;
      font-size: 14px;
    }

    .message {
      min-height: 20px;
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
    }

    .message.error {
      color: #b91c1c;
    }

    .message.success {
      color: #166534;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <img src="./img/blackeaglelogo.png" alt="Black Eagle Staffing logo" />
    </div>

    <h1>Login</h1>

    <form id="unifiedLoginForm">
      <div class="form-row">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="form-row">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>

      <button id="loginBtn" class="btn btn-primary" type="submit">Login</button>
      <div id="messageBox" class="message" aria-live="polite"></div>
    </form>

    <div class="link-list">
      <a class="btn btn-secondary" href="/Customer-logins/customer-login-create.html">Create Customer Account</a>
      <a class="btn btn-secondary" href="/staff-logins/staff-login-create.html">Create Staff Account</a>
      <a class="btn btn-secondary" href="/forgot/forgot.html">Forgot Password</a>
      <a class="btn btn-secondary" href="/">Back to Site</a>
    </div>

    <div class="footer-links">
      <a href="/privacy.html">Privacy</a>
      <a href="/terms.html">Terms</a>
    </div>
  </main>

  <script src="/js/unified-login.js"></script>
</body>
</html>
